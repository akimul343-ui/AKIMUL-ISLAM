<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ রাকিব [পার্সোনাল এআই অ্যাসিস্ট্যান্ট] - ACTIVE</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --neon-blue: #3b82f6;
            --neon-glow: #60a5fa;
            --text-color: #f3f4f6;
            --accent: #1d4ed8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        header {
            background: var(--card-bg);
            border-bottom: 2px solid var(--neon-blue);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
        }
        .status-badge {
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid var(--neon-blue);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            color: var(--neon-glow);
        }
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
            gap: 15px;
        }
        .chat-box {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 12px;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            padding: 10px 15px;
            border-radius: 10px;
            max-width: 80%;
            line-height: 1.5;
            font-size: 15px;
        }
        .message.user {
            background: var(--accent);
            color: #fff;
            align-self: flex-end;
        }
        .message.rakib {
            background: #1f2937;
            border: 1px solid var(--neon-glow);
            color: var(--text-color);
            align-self: flex-start;
        }
        .controls-panel {
            background: var(--card-bg);
            border: 1px solid var(--neon-blue);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .input-group {
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            background: #030712;
            border: 1px solid var(--neon-blue);
            padding: 12px 15px;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        button {
            background: var(--neon-blue);
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background: var(--neon-glow); }
        .call-btn { background: #16a34a; }
        .call-btn.active { background: #dc2626; }
    </style>
</head>
<body>

    <header>
        <h2>⚡ রাকিব (AI Assistant Core)</h2>
        <div class="status-badge">⚡ রাকিব [মাস্টার অটোমেশন] - ACTIVE</div>
    </header>

    <div class="main-container">
        <div class="chat-box" id="chatBox">
            <div class="message rakib">আসসালামু আলাইকুম। আমি রাকিব। এখন থেকে আর কোনো মুখস্থ উত্তর নয়—আপনার যেকোনো কথার সরাসরি এবং বুদ্ধিদীপ্ত উত্তর দিতে আমি প্রস্তুত। বলুন, কী করতে হবে?</div>
        </div>

        <div class="controls-panel">
            <div class="input-group">
                <button id="callToggleBtn" class="call-btn" onclick="toggleVoiceCall()">🎙️ লাইভ কল শুরু</button>
                <input type="text" id="userInput" placeholder="এখানে আপনার কমান্ড লিখুন..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">পাঠাও</button>
            </div>
        </div>
    </div>

    <script>
        let isCalling = false;
        let recognition = null;

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'bn-BD';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        function appendMessage(sender, text) {
            const chatBox = document.getElementById('chatBox');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const text = inputField.value.trim();
            if (!text) return;

            appendMessage('user', text);
            inputField.value = '';

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await res.json();
                if (data.status === 'success') {
                    appendMessage('rakib', data.reply);
                    speakText(data.reply);

                    if (data.action === 'direct_call') {
                        window.location.href = "tel:";
                    }
                }
            } catch (err) {
                appendMessage('rakib', 'সার্ভার কানেকশনে সমস্যা হয়েছে।');
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function toggleVoiceCall() {
            const btn = document.getElementById('callToggleBtn');
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

            if (!SpeechRecognition) {
                alert('আপনার ব্রাউজার লাইভ ভয়েস রেকর্ডিং সাপোর্ট করে না।');
                return;
            }

            if (!isCalling) {
                isCalling = true;
                btn.innerText = "🔴 কল চলছে (বন্ধ করুন)";
                btn.classList.add('active');
                appendMessage('rakib', 'লাইভ ভয়েস কল চালু হয়েছে। বলুন...');
                speakText('লাইভ কল শুরু হয়েছে। বলুন আমি শুনছি।');

                recognition = new SpeechRecognition();
                recognition.lang = 'bn-BD';
                recognition.continuous = true;
                recognition.interimResults = false;

                recognition.onresult = function(event) {
                    const speechToText = event.results[event.results.length - 1][0].transcript;
                    document.getElementById('userInput').value = speechToText;
                    sendMessage();
                };

                recognition.onend = function() {
                    if (isCalling) recognition.start();
                };

                recognition.start();
            } else {
                isCalling = false;
                btn.innerText = "🎙️ লাইভ কল শুরু";
                btn.classList.remove('active');
                if (recognition) recognition.stop();
                appendMessage('rakib', 'কল বন্ধ করা হয়েছে।');
            }
        }
    </script>
</body>
</html>
